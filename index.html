<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTPS Classroom Hub</title>
  <style>
    :root {
      --ptps-lime: #78BE20;
      --ptps-turquoise: #00A499;
      --ptps-gray: #888B8D;
      --ptps-bg-dark: #0d1416;
      --ptps-card-bg: #172124;
      --ptps-card-border: #28363a;
      --ptps-text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--ptps-bg-dark);
      color: var(--ptps-text-light);
      min-height: 100vh;
      padding: 1.25rem;
      transition: background-color 0.3s ease, padding 0.2s ease;
    }

    /* Ambient Alert Animations */
    body.time-loss-active {
      animation: room-alert-red 2s infinite ease-in-out;
    }
    body.noise-alert-active {
      animation: room-alert-orange 0.8s infinite ease-in-out;
    }

    @keyframes room-alert-red {
      0%, 100% { background-color: #1a0f16; }
      50% { background-color: #3b0d18; }
    }
    @keyframes room-alert-orange {
      0%, 100% { background-color: #1c130b; }
      50% { background-color: #451a03; }
    }

    /* Header Navigation */
    header {
      max-width: 1300px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--ptps-card-border);
      padding-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ptps-lime);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h1 span {
      color: var(--ptps-turquoise);
    }

    .badge {
      background: var(--ptps-card-bg);
      border: 1px solid var(--ptps-turquoise);
      padding: 0.4rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.825rem;
      color: var(--ptps-text-light);
      font-weight: 500;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* PC vs Mobile View Switcher Toggle */
    .view-mode-selector {
      display: flex;
      background: var(--ptps-card-bg);
      border: 1px solid var(--ptps-card-border);
      border-radius: 2rem;
      padding: 0.25rem;
      gap: 0.2rem;
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--ptps-gray);
      padding: 0.4rem 0.85rem;
      border-radius: 1.5rem;
      font-size: 0.825rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-btn.active {
      background: var(--ptps-turquoise);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 164, 153, 0.4);
    }

    .btn-reset-layout {
      background: var(--ptps-card-bg);
      border: 1px solid var(--ptps-card-border);
      color: var(--ptps-gray);
      padding: 0.45rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-reset-layout:hover {
      color: var(--ptps-text-light);
      border-color: var(--ptps-turquoise);
      background: rgba(0, 164, 153, 0.1);
    }

    /* Dashboard Grid Base */
    .dashboard-grid {
      display: grid;
      gap: 1.25rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* --- PC SPECIFIC VIEW STYLES --- */
    body.view-pc .dashboard-grid {
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }

    body.view-pc .tile {
      min-height: 180px;
      padding: 1.25rem;
      cursor: grab;
    }

    body.view-pc .display-main {
      font-size: 2.25rem;
    }

    body.view-pc .control-btn {
      padding: 0.85rem 2rem;
      font-size: 1.15rem;
    }

    /* --- MOBILE SPECIFIC VIEW STYLES --- */
    body.view-mobile {
      padding: 0.75rem;
    }

    body.view-mobile header {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
    }

    body.view-mobile .header-controls {
      width: 100%;
      justify-content: space-between;
    }

    body.view-mobile .dashboard-grid {
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 0.75rem;
    }

    body.view-mobile .tile {
      min-height: 140px;
      padding: 0.85rem;
      border-radius: 0.85rem;
    }

    body.view-mobile .tile-title {
      font-size: 0.9rem;
    }

    body.view-mobile .display-main {
      font-size: 1.75rem;
    }

    body.view-mobile .tile-subtext {
      font-size: 0.65rem;
    }

    body.view-mobile .tile-expand-icon {
      font-size: 0.65rem;
      padding: 0.2rem 0.35rem;
    }

    body.view-mobile .fullscreen-overlay {
      padding: 1rem;
    }

    body.view-mobile .big-display {
      font-size: 4.5rem;
    }

    body.view-mobile .control-btn {
      width: 100%;
      min-height: 48px; /* Touch-optimized tap targets */
      font-size: 1.05rem;
      padding: 0.75rem 1.2rem;
      margin: 0.25rem 0;
    }

    body.view-mobile .music-grid {
      grid-template-columns: 1fr !important;
    }

    /* Tile Component */
    .tile {
      background: var(--ptps-card-bg);
      border: 1px solid var(--ptps-card-border);
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      position: relative;
    }

    .tile:active {
      cursor: grabbing;
    }

    .tile:hover {
      transform: translateY(-3px);
      border-color: var(--ptps-turquoise);
      box-shadow: 0 10px 20px -5px rgba(0, 164, 153, 0.3);
    }

    .tile.grid-dragging {
      opacity: 0.4;
      border-color: var(--ptps-lime);
    }

    .tile.grid-drag-over {
      border-color: var(--ptps-lime);
      background: rgba(120, 190, 32, 0.12);
      transform: scale(1.03);
    }

    .tile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .tile-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--ptps-text-light);
    }

    .drag-handle-icon {
      font-size: 0.9rem;
      color: var(--ptps-gray);
      opacity: 0.6;
    }

    .tile-expand-icon {
      color: var(--ptps-gray);
      background: var(--ptps-bg-dark);
      border-radius: 0.4rem;
      border: 1px solid var(--ptps-card-border);
    }

    .tile-body {
      text-align: center;
      margin: 0.5rem 0;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .display-main {
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--ptps-lime);
    }

    .tile-subtext {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ptps-gray);
      margin-top: 0.3rem;
      font-weight: 600;
    }

    /* Time Loss Tile Specific */
    .tile-time-loss {
      background: linear-gradient(145deg, var(--ptps-card-bg), var(--ptps-bg-dark));
      border: 2px solid #ef4444;
    }

    /* Fullscreen Modal Overlay */
    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 20, 22, 0.96);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      padding: 2rem;
      transition: background-color 0.2s ease;
      overflow-y: auto;
    }

    .fullscreen-overlay.active {
      display: flex;
    }

    .fullscreen-overlay.loud-alert-active {
      animation: loud-bg-blink 0.35s infinite alternate ease-in-out;
    }

    @keyframes loud-bg-blink {
      0% { background: rgba(13, 20, 22, 0.96); }
      100% { background: rgba(220, 38, 38, 0.92); }
    }

    .fullscreen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto 1.5rem auto;
      border-bottom: 1px solid var(--ptps-card-border);
      padding-bottom: 1rem;
    }

    .fullscreen-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--ptps-lime);
    }

    .btn-close {
      background: var(--ptps-card-border);
      border: 1px solid var(--ptps-gray);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.6rem 1.4rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-close:hover {
      background: #ef4444;
      border-color: #ef4444;
    }

    .fullscreen-content {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Widget Components inside Fullscreen */
    .big-display {
      font-size: 7.5rem;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--ptps-lime);
    }

    .loud-alert-banner {
      display: none;
      color: #ffffff;
      font-size: 2.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-shadow: 0 0 20px #000;
      margin-bottom: 1.5rem;
      animation: pulse-loud 0.3s infinite alternate;
      text-align: center;
    }

    @keyframes pulse-loud {
      from { transform: scale(0.95); }
      to { transform: scale(1.05); }
    }

    .control-btn {
      background: var(--ptps-turquoise);
      color: #fff;
      border: none;
      font-weight: 700;
      border-radius: 0.75rem;
      cursor: pointer;
      margin: 0.35rem;
      transition: transform 0.1s, background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .control-btn:hover {
      transform: scale(1.02);
      background: #00837a;
    }
    .control-btn.danger { background: #ef4444; }
    .control-btn.danger:hover { background: #dc2626; }
    .control-btn.secondary { background: var(--ptps-gray); }
    .control-btn.secondary:hover { background: #6f7274; }
    .control-btn.preset {
      background: var(--ptps-card-bg);
      border: 1px solid var(--ptps-card-border);
      color: var(--ptps-text-light);
      font-size: 0.95rem;
      padding: 0.55rem 1.1rem;
    }
    .control-btn.preset:hover {
      background: var(--ptps-lime);
      color: var(--ptps-bg-dark);
      border-color: var(--ptps-lime);
      font-weight: 800;
    }

    /* Meter Progress Bar */
    .meter-container {
      width: 100%;
      max-width: 650px;
      height: 28px;
      background: var(--ptps-card-border);
      border-radius: 14px;
      overflow: hidden;
      margin: 1.5rem 0;
      position: relative;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: var(--ptps-lime);
      transition: width 0.1s ease, background-color 0.2s ease;
    }
    .sensitivity-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #ffffff;
      box-shadow: 0 0 8px #fff;
      z-index: 2;
    }

    /* Traffic Light */
    .traffic-light-box {
      background: var(--ptps-card-bg);
      padding: 1.5rem;
      border-radius: 2rem;
      display: flex;
      gap: 1.5rem;
      border: 2px solid var(--ptps-card-border);
    }
    .light-bulb {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      opacity: 0.25;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .light-bulb.red { background: #ef4444; box-shadow: 0 0 30px #ef4444; }
    .light-bulb.yellow { background: #eab308; box-shadow: 0 0 30px #eab308; }
    .light-bulb.green { background: var(--ptps-lime); box-shadow: 0 0 30px var(--ptps-lime); }
    .light-bulb.active { opacity: 1; transform: scale(1.1); }

    /* Interactive List Container */
    .interactive-list {
      width: 100%;
      max-width: 650px;
      background: var(--ptps-card-bg);
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid var(--ptps-card-border);
      max-height: 380px;
      overflow-y: auto;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--ptps-card-border);
      align-items: center;
      gap: 0.5rem;
    }
    .list-item:last-child { border-bottom: none; }

    /* Drag & Drop Desk Tiles in Seating Grid */
    .desk-tile {
      background: var(--ptps-card-bg);
      padding: 0.85rem 0.6rem;
      border-radius: 0.75rem;
      text-align: center;
      border: 2px dashed var(--ptps-card-border);
      font-size: 0.85rem;
      cursor: grab;
      user-select: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 80px;
    }
    .desk-tile:active { cursor: grabbing; }
    .desk-tile:hover {
      border-color: var(--ptps-turquoise);
      transform: translateY(-2px);
    }
    .desk-tile.dragging {
      opacity: 0.4;
      border-color: var(--ptps-lime);
    }
    .desk-tile.drag-over {
      border-color: var(--ptps-lime);
      background: rgba(120, 190, 32, 0.15);
      transform: scale(1.05);
    }

    /* Music Category Section */
    .music-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      width: 100%;
      max-width: 800px;
    }
    .music-card {
      background: var(--ptps-card-bg);
      border: 1px solid var(--ptps-card-border);
      padding: 1.25rem;
      border-radius: 0.85rem;
    }
    .music-card-title {
      font-weight: 700;
      color: var(--ptps-turquoise);
      margin-bottom: 0.75rem;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Form Controls */
    input[type="text"], input[type="number"], textarea, select {
      background: var(--ptps-bg-dark);
      border: 1px solid var(--ptps-card-border);
      color: #fff;
      padding: 0.65rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 1rem;
    }

    input[type="range"] {
      width: 100%;
      max-width: 400px;
      accent-color: var(--ptps-turquoise);
    }
  </style>
</head>
<body class="view-pc">

  <header>
    <div class="header-title-group">
      <h1>PTPS <span>Classroom Hub</span></h1>
      <div class="badge">Pei Tong Primary School</div>
    </div>
    <div class="header-controls">
      <!-- Device View Choice Selector -->
      <div class="view-mode-selector">
        <button id="btnViewPc" class="view-btn active" onclick="setDeviceView('pc')">💻 PC View</button>
        <button id="btnViewMobile" class="view-btn" onclick="setDeviceView('mobile')">📱 Mobile View</button>
      </div>
      <button class="btn-reset-layout" onclick="resetTileOrder()">⇄ Reset Grid</button>
    </div>
  </header>

  <!-- DASHBOARD DYNAMIC GRID CONTAINER -->
  <div class="dashboard-grid" id="dashboardGridContainer">
    <!-- Rendered dynamically by JavaScript to support Drag and Drop Layout Reordering -->
  </div>

  <!-- FULLSCREEN OVERLAY MODAL -->
  <div class="fullscreen-overlay" id="fullscreenOverlay">
    <div class="fullscreen-header">
      <div class="fullscreen-title" id="overlayTitle">Tool Name</div>
      <button class="btn-close" onclick="closeTool()">✕ Exit Full Screen</button>
    </div>
    <div class="fullscreen-content" id="overlayContent">
      <!-- Dynamic Content Loaded Here -->
    </div>
  </div>

  <script>
    // --- AUDIO SYNTHESIZER FOR SFX & BELLS ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'start') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'stop') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(523, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'bell') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046.5, now);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
        osc.start(now); osc.stop(now + 1.8);
      } else if (type === 'buzzer') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
      } else if (type === 'loudAlert') {
        const highOsc = audioCtx.createOscillator();
        const highGain = audioCtx.createGain();
        highOsc.type = 'sine';
        highOsc.frequency.setValueAtTime(17400, now);
        highGain.gain.setValueAtTime(0.5, now);
        highGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        highOsc.connect(highGain);
        highGain.connect(audioCtx.destination);
        highOsc.start(now);
        highOsc.stop(now + 0.5);

        const adultOsc = audioCtx.createOscillator();
        const adultGain = audioCtx.createGain();
        adultOsc.type = 'triangle';
        adultOsc.frequency.setValueAtTime(800, now);
        adultOsc.frequency.exponentialRampToValueAtTime(400, now + 0.4);
        adultGain.gain.setValueAtTime(0.4, now);
        adultGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        adultOsc.connect(adultGain);
        adultGain.connect(audioCtx.destination);
        adultOsc.start(now);
        adultOsc.stop(now + 0.4);
      } else if (type === 'tada') {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.setValueAtTime(freq, now + idx * 0.08);
          g.gain.setValueAtTime(0.3, now + idx * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
          o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.3);
        });
      }
    }

    // --- DEVICE VIEW SWITCHER (PC vs MOBILE) ---
    let currentDeviceView = 'pc';

    function loadDeviceViewChoice() {
      const saved = localStorage.getItem('ptps_hub_device_view');
      if (saved === 'mobile' || saved === 'pc') {
        currentDeviceView = saved;
      } else {
        currentDeviceView = window.innerWidth <= 768 ? 'mobile' : 'pc';
      }
      applyDeviceView();
    }

    function setDeviceView(view) {
      currentDeviceView = view;
      localStorage.setItem('ptps_hub_device_view', view);
      applyDeviceView();
    }

    function applyDeviceView() {
      document.body.classList.remove('view-pc', 'view-mobile');
      document.body.classList.add(`view-${currentDeviceView}`);
      
      const btnPc = document.getElementById('btnViewPc');
      const btnMobile = document.getElementById('btnViewMobile');
      if (btnPc && btnMobile) {
        btnPc.classList.toggle('active', currentDeviceView === 'pc');
        btnMobile.classList.toggle('active', currentDeviceView === 'mobile');
      }
    }

    // --- GLOBAL DATA & STATES ---
    let roster = ["Alex", "Jordan", "Taylor", "Morgan", "Sam", "Chris", "Riley", "Casey", "Avery", "Quinn", "Skyler", "Dakota"];
    let activeToolId = null;

    // Time Loss State
    let timeLossRunning = false;
    let timeLossTotalMs = 0;
    let timeLossStartMark = 0;
    let timeLossInterval = null;

    // Noise Meter State
    let micStream = null;
    let analyser = null;
    let noiseThreshold = 65;
    let isNoiseActive = false;
    let lastNoiseAlertTime = 0;

    // Countdown Timer State
    let timerSeconds = 300;
    let timerRunning = false;
    let timerInterval = null;

    // Stopwatch State
    let stopwatchMs = 0;
    let stopwatchRunning = false;
    let stopwatchInterval = null;

    // Traffic Light State
    let currentLight = 'red';

    // Attendance State
    let attendanceStatus = {};

    // Seating Grid State
    let seatingRows = 4;

        tileEl.setAttribute('data-id', toolId);

        `;

        tileEl.addEventListener('dragstart', (e) => handleGridDragStart(e, toolId));
        tileEl.addEventListener('dragover', (e) => handleGridDragOver(e));
        tileEl.addEventListener('dragleave', (e) => handleGridDragLeave(e));
        tileEl.addEventListener('drop', (e) => handleGridDrop(e, toolId));
        tileEl.addEventListener('dragend', (e) => handleGridDragEnd(e));

    function handleGridDragStart(e, toolId) {
      draggedTileId = toolId;
      isTileDragging = true;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', toolId);
      e.currentTarget.classList.add('grid-dragging');
    }

    function handleGridDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.classList.add('grid-drag-over');
    }

    function handleGridDragLeave(e) {
      e.currentTarget.classList.remove('grid-drag-over');
    }

    function handleGridDrop(e, targetToolId) {
      e.preventDefault();
      e.currentTarget.classList.remove('grid-drag-over');

      if (draggedTileId && draggedTileId !== targetToolId) {
        const fromIdx = tileOrder.indexOf(draggedTileId);
        const toIdx = tileOrder.indexOf(targetToolId);
        if (fromIdx > -1 && toIdx > -1) {
          tileOrder.splice(fromIdx, 1);
          tileOrder.splice(toIdx, 0, draggedTileId);
          saveTileOrder();
          renderDashboardGrid();
        }
      }
      draggedTileId = null;
    }

    function handleGridDragEnd(e) {
      e.currentTarget.classList.remove('grid-dragging');
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('grid-drag-over'));
      setTimeout(() => { isTileDragging = false; }, 60);

    // --- NOISE METER LOGIC ---
    async function toggleNoiseMic() {
      if (!isNoiseActive) {
        try {
          initAudio();
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioCtx.createMediaStreamSource(micStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          source.connect(analyser);
          isNoiseActive = true;
          
          updateTileDisplay('noiseMeter');
          startMicProcessing();
        } catch(e) {
          alert("Microphone access is required for Noise Meter.");
        }
      } else {
        isNoiseActive = false;
        if (micStream) micStream.getTracks().forEach(t => t.stop());
        updateTileDisplay('noiseMeter');
        document.body.classList.remove('noise-alert-active');
        const overlay = document.getElementById('fullscreenOverlay');
        if (overlay) overlay.classList.remove('loud-alert-active');
      }
      if (activeToolId === 'noiseMeter') renderToolContent('noiseMeter', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
    }

    function updateSensitivity(val) {
      noiseThreshold = val;
      const line = document.getElementById('sensitivityLine');
      if (line) line.style.left = val + '%';
      const lbl = document.getElementById('threshVal');
      if (lbl) lbl.textContent = val;
    }

    function startMicProcessing() {
      if (!isNoiseActive || !analyser) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length;
      const vol = Math.min(100, Math.round((avg / 120) * 100));

      const fill = document.getElementById('noiseMeterFill');
      const disp = document.getElementById('noiseVolumeDisplay');
      const banner = document.getElementById('loudAlertMsg');
      const overlay = document.getElementById('fullscreenOverlay');

      if (fill) fill.style.width = vol + '%';
      if (disp) disp.textContent = vol + '%';

      if (vol > noiseThreshold) {
        if (fill) fill.style.backgroundColor = '#ef4444';
        document.body.classList.add('noise-alert-active');
        if (banner) banner.style.display = 'block';
        if (overlay && activeToolId === 'noiseMeter') overlay.classList.add('loud-alert-active');

        const now = Date.now();
        if (now - lastNoiseAlertTime > 1500) {
          playSound('loudAlert');
          lastNoiseAlertTime = now;
        }
      } else {
        if (fill) fill.style.backgroundColor = 'var(--ptps-lime)';
        document.body.classList.remove('noise-alert-active');
        if (banner) banner.style.display = 'none';
        if (overlay) overlay.classList.remove('loud-alert-active');
      }

      if (isNoiseActive) requestAnimationFrame(startMicProcessing);
    }

    // --- TIMER LOGIC ---
    function toggleTimer() {
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
      } else {
        if (timerSeconds <= 0) return;
        timerRunning = true;
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            const d = document.getElementById('timerBigDisplay');
            if (d) d.textContent = formatTime(timerSeconds * 1000);
            updateTileDisplay('timer');
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            playSound('buzzer');
          }
        }, 1000);
      }
      if (activeToolId === 'timer') renderToolContent('timer', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
    }

    function setTimerSecs(s) {
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
      }
      timerSeconds = s;
      const d = document.getElementById('timerBigDisplay');
      if (d) d.textContent = formatTime(timerSeconds * 1000);
      updateTileDisplay('timer');
      if (activeToolId === 'timer') renderToolContent('timer', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
    }

    function setCustomTimer() {
      const minInput = document.getElementById('customMin');
      const secInput = document.getElementById('customSec');
      const m = parseInt(minInput ? minInput.value : 0) || 0;
      const s = parseInt(secInput ? secInput.value : 0) || 0;
      setTimerSecs((m * 60) + s);
    }

    // --- STOPWATCH LOGIC ---
    function toggleStopwatch() {

        clearInterval(stopwatchInterval);
        stopwatchRunning = false;
      } else {
        stopwatchRunning = true;
        const mark = Date.now() - stopwatchMs;
        stopwatchInterval = setInterval(() => {
          stopwatchMs = Date.now() - mark;
          const d = document.getElementById('stopwatchBigDisplay');
          if (d) d.textContent = formatTime(stopwatchMs);
          updateTileDisplay('stopwatch');
        }, 200);
      }
      if (activeToolId === 'stopwatch') renderToolContent('stopwatch', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
    }

    function resetStopwatch() {
      stopwatchMs = 0;
      updateTileDisplay('stopwatch');
      if (activeToolId === 'stopwatch') renderToolContent('stopwatch', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
    }

    // --- TRAFFIC LIGHT LOGIC ---
    function setLight(color) {
      currentLight = color;
      updateTileDisplay('traffic');
      if (activeToolId === 'traffic') renderToolContent('traffic', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
    }

    // --- GROUPS LOGIC ---
    function generateGroups(num) {
      const shuffled = [...roster].sort(() => 0.5 - Math.random());
      let html = '';
      for (let i = 0; i < num; i++) {
        html += `<div class="list-item"><b style="color:var(--ptps-lime);">Group ${i+1}</b><span>`;
        const members = shuffled.filter((_, idx) => idx % num === i);
        html += (members.length > 0 ? members.join(', ') : 'Empty') + `</span></div>`;
      }
      const container = document.getElementById('groupListDisplay');
      if (container) container.innerHTML = html;
      
      const gridDisp = document.getElementById('grid_groups_display');
      if (gridDisp) gridDisp.textContent = `${num} Groups`;
    }

    // --- ATTENDANCE LOGIC ---
    function initAttendance() {
      roster.forEach(name => {
        if (attendanceStatus[name] === undefined) {
          attendanceStatus[name] = true;
        }
      });
    }

    function markAllPresent() {
      roster.forEach(name => { attendanceStatus[name] = true; });
      updateAttendanceDisplay();
    }

    function markAllAbsent() {
      roster.forEach(name => { attendanceStatus[name] = false; });
      updateAttendanceDisplay();
    }

    function toggleStudentAttendance(name) {
      attendanceStatus[name] = !attendanceStatus[name];
      updateAttendanceDisplay();
    }

    function updateAttendanceDisplay() {
      initAttendance();
      updateTileDisplay('attendance');
      if (activeToolId === 'attendance') {
        renderAttendanceTool(document.getElementById('overlayContent'));
      }
    }

    function renderAttendanceTool(container) {
      initAttendance();
      const presentCount = roster.filter(name => attendanceStatus[name] !== false).length;
      const total = roster.length;
      const percent = total > 0 ? Math.round((presentCount / total) * 100) : 100;

      let html = `
        <div style="margin-bottom: 1.25rem; display: flex; gap: 0.5rem; align-items: center; justify-content: center; flex-wrap: wrap; width:100%; max-width:400px;">
          <button class="control-btn" style="font-size: 0.95rem; background: var(--ptps-lime); color: var(--ptps-bg-dark);" onclick="markAllPresent()">✓ All Present</button>
          <button class="control-btn danger" style="font-size: 0.95rem;" onclick="markAllAbsent()">✕ All Absent</button>
        </div>
        <div style="margin-bottom: 1rem; color: var(--ptps-gray); font-size: 0.95rem; text-align: center;">
          Present: <strong style="color:var(--ptps-lime);">${presentCount}/${total}</strong> (${percent}%)
        </div>
        <div class="interactive-list">
      `;

      roster.forEach(name => {
        const isPresent = attendanceStatus[name] !== false;
        html += `
          <div class="list-item">
            <span style="font-size: 1.05rem; font-weight: 500;">${name}</span>
            <button class="control-btn ${isPresent ? '' : 'danger'}" 
                    style="font-size: 0.85rem; padding: 0.35rem 0.9rem; margin: 0; width: auto; min-width: 95px;" 
                    onclick="toggleStudentAttendance('${name}')">
              ${isPresent ? '✓ Present' : '✕ Absent'}
            </button>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    // --- SEATING GRID LOGIC ---
    function syncSeatingArrangement() {
      const totalDesks = seatingRows * seatingCols;
      if (seatingArrangement.length !== totalDesks) {
        const oldArr = [...seatingArrangement];
        seatingArrangement = [];
        for (let i = 0; i < totalDesks; i++) {
          if (i < oldArr.length && oldArr[i]) {
            seatingArrangement.push(oldArr[i]);
          } else if (i < roster.length) {
            seatingArrangement.push(roster[i]);
          } else {
            seatingArrangement.push('Empty');
          }
        }
      }
    }

    function resetSeatingArrangement() {
      const totalDesks = seatingRows * seatingCols;
      seatingArrangement = [];
      for (let i = 0; i < totalDesks; i++) {
        seatingArrangement.push(roster[i] || 'Empty');
      }
      if (activeToolId === 'seating') {
        renderToolContent('seating', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
      }
    }

    function renderSeatingGrid(container) {
      syncSeatingArrangement();

      let html = `
        <div style="margin-bottom: 1rem; display: flex; gap: 0.75rem; align-items: center; justify-content: center; background: var(--ptps-card-bg); padding: 0.75rem; border-radius: 1rem; border: 1px solid var(--ptps-card-border); flex-wrap: wrap;">
          <label style="color:var(--ptps-gray); font-size:0.9rem;">Rows: 
            <input type="number" id="seatRowsInput" value="${seatingRows}" min="1" max="10" style="width:55px; text-align:center;" />
          </label>
          <span style="color:var(--ptps-gray);">x</span>
          <label style="color:var(--ptps-gray); font-size:0.9rem;">Cols: 
            <input type="number" id="seatColsInput" value="${seatingCols}" min="1" max="10" style="width:55px; text-align:center;" />
          </label>
          <button class="control-btn" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; margin:0; width:auto;" onclick="updateSeatingGridDimensions()">Set</button>
          <button class="control-btn secondary" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; margin:0; width:auto;" onclick="resetSeatingArrangement()">Auto-Fill</button>
        </div>

        <p style="color: var(--ptps-gray); font-size: 0.85rem; margin-bottom: 1rem; text-align: center;">
          💡 Drag or tap desks to swap student placement.
        </p>

        <div style="display:grid; grid-template-columns: repeat(${seatingCols}, 1fr); gap:0.6rem; width:100%; max-width:850px; max-height:380px; overflow-y:auto; padding: 0.25rem;">
      `;

      const totalDesks = seatingRows * seatingCols;
      for (let i = 0; i < totalDesks; i++) {
        const studentName = seatingArrangement[i] || 'Empty';
        const isEmpty = studentName === 'Empty';

        html += `
          <div class="desk-tile" 
               draggable="true" 
               ondragstart="handleDeskDragStart(event, ${i})"
               ondragover="handleDeskDragOver(event)"
               ondragleave="handleDeskDragLeave(event)"
               ondrop="handleDeskDrop(event, ${i})"
               ondragend="handleDeskDragEnd(event)">
            <span style="font-size: 0.7rem; color: var(--ptps-gray);">Desk ${i+1}</span>
            <strong style="color: ${isEmpty ? 'var(--ptps-gray)' : 'var(--ptps-turquoise)'}; font-size:0.9rem; margin-top:0.15rem;">
              ${studentName}
            </strong>
          </div>
        `;
      }
      html += `</div>`;
      container.innerHTML = html;
      updateTileDisplay('seating');
    }

    function updateSeatingGridDimensions() {
      const r = parseInt(document.getElementById('seatRowsInput').value) || 1;
      const c = parseInt(document.getElementById('seatColsInput').value) || 1;
      seatingRows = Math.max(1, Math.min(10, r));
      seatingCols = Math.max(1, Math.min(10, c));
      
      seatingArrangement = [];
      syncSeatingArrangement();
      renderToolContent('seating', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
    }

    function handleDeskDragStart(e, index) {
      draggedDeskIndex = index;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', index);
      e.currentTarget.classList.add('dragging');
    }

    function handleDeskDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.classList.add('drag-over');
    }

    function handleDeskDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDeskDrop(e, targetIndex) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');

      if (draggedDeskIndex !== null && draggedDeskIndex !== targetIndex) {
        const temp = seatingArrangement[draggedDeskIndex];
        seatingArrangement[draggedDeskIndex] = seatingArrangement[targetIndex];
        seatingArrangement[targetIndex] = temp;

        if (activeToolId === 'seating') {
          renderSeatingGrid(document.getElementById('overlayContent'));
        }
      }
      draggedDeskIndex = null;
    }

    function handleDeskDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.desk-tile').forEach(tile => tile.classList.remove('drag-over'));
      draggedDeskIndex = null;
    }

    // --- SCHEDULE LOGIC ---
    function renderSchedule(container) {
      let html = `
        <div style="margin-bottom: 1rem; display: flex; gap: 0.5rem; width: 100%; max-width: 650px; flex-wrap: wrap;">
          <input type="text" id="newScheduleTime" placeholder="e.g. 09:00 AM" style="width: 130px;" />
          <input type="text" id="newScheduleActivity" placeholder="Activity name..." style="flex: 1; min-width:180px;" onkeypress="if(event.key==='Enter') addScheduleItem()" />
          <button class="control-btn" style="font-size: 0.9rem; padding: 0.5rem 1rem; margin: 0; width:auto;" onclick="addScheduleItem()">+ Add</button>
        </div>
        <div class="interactive-list">
      `;

      scheduleData.forEach((item, idx) => {
        html += `
          <div class="list-item">
            <input type="text" value="${item.time}" onchange="updateScheduleItem(${idx}, 'time', this.value)" style="width: 100px; background: var(--ptps-bg-dark); border: 1px solid var(--ptps-card-border); color: var(--ptps-turquoise); font-weight: bold; border-radius: 0.4rem; padding: 0.35rem; text-align: center; font-size:0.85rem;" />
            <input type="text" value="${item.activity}" onchange="updateScheduleItem(${idx}, 'activity', this.value)" style="flex: 1; background: transparent; border: none; color: #fff; font-size: 0.95rem;" />
            <button class="btn-close" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="removeScheduleItem(${idx})">✕</button>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
      updateTileDisplay('schedule');
    }

    function addScheduleItem() {
      const timeInput = document.getElementById('newScheduleTime');
      const actInput = document.getElementById('newScheduleActivity');
      if (!actInput || !actInput.value.trim()) return;

      const timeVal = (timeInput && timeInput.value.trim()) ? timeInput.value.trim() : '00:00';
      scheduleData.push({ id: Date.now(), time: timeVal, activity: actInput.value.trim() });
      if (activeToolId === 'schedule') renderSchedule(document.getElementById('overlayContent'));
      updateTileDisplay('schedule');
    }

    function updateScheduleItem(idx, field, val) {
      if (scheduleData[idx]) scheduleData[idx][field] = val;
    }

    function removeScheduleItem(idx) {
      scheduleData.splice(idx, 1);
      if (activeToolId === 'schedule') renderSchedule(document.getElementById('overlayContent'));
      updateTileDisplay('schedule');
    }

    // --- CHECKLIST LOGIC ---
    function renderChecklist(container) {
      let html = `
        <div style="margin-bottom: 1rem; display: flex; gap: 0.5rem; width: 100%; max-width: 650px; flex-wrap: wrap;">
          <input type="text" id="newCheckitemText" placeholder="Add task..." style="flex: 1; min-width:180px;" onkeypress="if(event.key==='Enter') addChecklistItem()" />
          <button class="control-btn" style="font-size: 0.9rem; padding: 0.5rem 1rem; margin: 0; width:auto;" onclick="addChecklistItem()">+ Add</button>
        </div>
        <div class="interactive-list">
      `;

      checklist.forEach((item, idx) => {
        html += `
          <div class="list-item">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheck(${idx})" style="width: 20px; height: 20px; cursor: pointer; accent-color: var(--ptps-turquoise);" />
            <input type="text" value="${item.text}" onchange="updateChecklistText(${idx}, this.value)" style="flex:1; background:transparent; border:none; color:#fff; font-size:0.95rem; ${item.done ? 'text-decoration: line-through; opacity: 0.5;' : ''}" />
            <button class="btn-close" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="removeChecklistItem(${idx})">✕</button>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
      updateTileDisplay('checklist');
    }

    function toggleCheck(idx) {
      checklist[idx].done = !checklist[idx].done;
      updateTileDisplay('checklist');
      if (activeToolId === 'checklist') renderToolContent('checklist', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
    }

    function updateChecklistText(idx, val) {
      checklist[idx].text = val;
    }

    function addChecklistItem() {
      const input = document.getElementById('newCheckitemText');
      if (!input || !input.value.trim()) return;
      checklist.push({ id: Date.now(), text: input.value.trim(), done: false });
      input.value = '';
      if (activeToolId === 'checklist') renderToolContent('checklist', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
      updateTileDisplay('checklist');
    }

    function removeChecklistItem(idx) {
      checklist.splice(idx, 1);
      if (activeToolId === 'checklist') renderToolContent('checklist', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
      updateTileDisplay('checklist');
    }

    // --- REAL BACKGROUND MUSIC LOGIC ---
    function renderBackgroundMusic(container) {
      let html = `
        <div style="margin-bottom: 1.5rem; text-align: center; width:100%;">
          <p style="font-size: 1.15rem; color: var(--ptps-lime); font-weight: 700; margin-bottom: 0.5rem;">
            ${isMusicPlaying ? `▶️ Now Playing: ${currentMusicTrackName}` : '⏹️ Music Stopped'}
          </p>
          <div style="display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap;">
            <button class="control-btn danger" style="width:auto; padding: 0.5rem 1.2rem;" onclick="stopBgMusic()">Stop Music</button>
            <label style="color:var(--ptps-gray); font-size:0.9rem; display: flex; align-items: center; gap: 0.5rem;">Volume: 
              <input type="range" min="0" max="1" step="0.05" value="${musicVolume}" oninput="setMusicVolume(this.value)" style="width: 120px;" />
            </label>
          </div>
        </div>
        <div class="music-grid">
      `;

      for (let category in bgMusicCatalog) {
        const catIcon = category === 'Hype' ? '🔥' : '🎹';
        const subTitle = category === 'Hype' ? 'Upbeat & Active' : 'Slow, Soothing Instrumental';
        
        html += `<div class="music-card">
          <div class="music-card-title">${catIcon} ${category} Mode</div>
          <p style="font-size: 0.75rem; color: var(--ptps-gray); margin-bottom: 0.75rem;">${subTitle}</p>`;
        
        bgMusicCatalog[category].forEach(trackObj => {
          const active = isMusicPlaying && currentMusicTrackName === trackObj.name;
          html += `
            <button class="control-btn preset" style="width:100%; margin:0.3rem 0; text-align:left; display: flex; justify-content: space-between; align-items: center; ${active ? 'background:var(--ptps-lime); color:var(--ptps-bg-dark); font-weight:bold;' : ''}" 
              onclick="playBgMusic('${category}', '${trackObj.name}', '${trackObj.url}')">
              <span>${active ? '▶ ' : '🎵 '}${trackObj.name}</span>
              <span style="font-size:0.75rem; opacity:0.8;">🔂 Loop</span>
            </button>
          `;
        });
        html += `</div>`;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function playBgMusic(category, trackName, url) {
      if (isMusicPlaying && currentMusicTrackName === trackName) return;

      bgAudioPlayer.pause();
      bgAudioPlayer.src = url;
      bgAudioPlayer.loop = true;
      bgAudioPlayer.volume = musicVolume;
      
      bgAudioPlayer.play().then(() => {
        isMusicPlaying = true;
        currentMusicCategory = category;
        currentMusicTrackName = trackName;
        updateTileDisplay('bgMusic');
        if (activeToolId === 'bgMusic') renderToolContent('bgMusic', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
      }).catch(err => {
        alert("Audio playback failed: " + err.message);
      });
    }

    function stopBgMusic() {
      bgAudioPlayer.pause();
      isMusicPlaying = false;
      currentMusicCategory = null;
      currentMusicTrackName = null;
      updateTileDisplay('bgMusic');
      if (activeToolId === 'bgMusic') renderToolContent('bgMusic', document.getElementById('overlayTitle'), document.getElementById('overlayContent'));
    }

    function setMusicVolume(val) {
      musicVolume = parseFloat(val);
      bgAudioPlayer.volume = musicVolume;
    }

    // --- HELPER UTILITIES ---
    function updateTileDisplay(toolId) {
      const def = toolDefinitions[toolId];
      if (!def) return;
      const disp = document.getElementById(`grid_${toolId}_display`);
      const sub = document.getElementById(`grid_${toolId}_subtext`);
      if (disp) disp.textContent = def.getDisplay();
      if (sub) sub.textContent = def.getSubtext();
    }

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      loadDeviceViewChoice();
      loadSavedTileOrder();
      renderDashboardGrid();
    });
  </script>
</body>
</html>
