<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTPS Classroom Hub | Pei Tong Primary School</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="view-pc">

  <!-- TOP HEADER -->
  <header class="ptps-header">
    <div class="header-brand">
      <div class="ptps-logo-badge">PTPS</div>
      <div>
        <h1>Pei Tong <span>Classroom Hub</span></h1>
        <p class="motto-tagline">🌱 We Look Ahead • Progress & Transformation</p>
      </div>
    </div>

    <div class="header-actions">
      <!-- Theme Switcher (Light / Dark) -->
      <button id="themeToggleBtn" class="pill-btn theme-btn" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span> <span id="themeLabel">Light Mode</span>
      </button>

      <!-- PC / Mobile Selector -->
      <div class="view-mode-selector">
        <button id="btnViewPc" class="view-btn active" onclick="setDeviceView('pc')">💻 PC View</button>
        <button id="btnViewMobile" class="view-btn" onclick="setDeviceView('mobile')">📱 Mobile View</button>
      </div>

      <!-- Reset Grid Order -->
      <button class="pill-btn secondary-btn" onclick="resetTileOrder()">⇄ Reset Grid</button>
    </div>
  </header>

  <!-- MAIN DASHBOARD GRID CONTAINER -->
  <main class="dashboard-grid" id="dashboardGridContainer"></main>

  <!-- FULLSCREEN OVERLAY MODAL -->
  <div class="fullscreen-overlay" id="fullscreenOverlay">
    <div class="fullscreen-header">
      <div class="fullscreen-title" id="overlayTitle">Tool Name</div>
      <button class="btn-close" onclick="closeTool()">✕ Exit Full Screen</button>
    </div>
    <div class="fullscreen-content" id="overlayContent"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
